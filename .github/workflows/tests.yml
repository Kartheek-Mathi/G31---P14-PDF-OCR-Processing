name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.0.2 httpx==0.28.1
      - run: python -m pytest -q --junitxml=EVALUATIONS/results/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: EVALUATIONS/results/ci-tests.xml
# This workflow has not been executed on a remote GitHub runner in the artifact build.
# It does not invoke optional external services or regenerate the OCR experiment.
